# Deployed by Argo CD (apps/prism.yaml in selfhosted-platform) into the
# monitoring namespace: the prism workers (worker.yaml). The worker workflow
# (.github/workflows/worker.yaml) pins the image below (name and digest). The
# prism-config ConfigMap (endpoints, machines, devices, default model) lives
# in selfhosted-platform's manifests/alerting; the prism-worker,
# prism-events, prism-push, prism-alerts, prism-text-generation,
# prism-telemetry and alerting-t3 Sealed Secrets in its manifests/secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - worker.yaml
# The public Rocky coordinator's trust bundle (https://rocky.quickme.at/
# bundle.json, pinned here): the workers' seals become final there
# (docs/worker.md "Sealing"). Once the database names this coordinator it
# can never name another, so this file changes only with a new database.
# jobs/ is not listed: the rollout Job is applied by hand.
configMapGenerator:
  - name: prism-rocky-coordinator
    files:
      - bundle.json=rocky-coordinator-bundle.json
    options:
      disableNameSuffixHash: true
images:
  - name: prism-worker
    newName: ghcr.io/bierdav/prism-worker
    newTag: 15d47d3db83a0e210fad275427c9ce1abe935b4e-45785803167
    digest: sha256:bca1e8ef2da075c046f51b7ce6e3e13d5ccf7756c51005dc9d7adcaa9e74fcd1
