# Tests and builds the prism worker image (worker/, rocky-prism/, and the
# prism CLI it ships, cli/) on every push to main that changes it, natively
# on an x64 and an arm64 runner (Rust with Rocky's bundled SQLite doesn't
# cross-compile easily). Per architecture, the jobs run side by side: the
# workspace's tests, split across runners, and the release build, which
# pushes the binaries in a distroless image (worker/Dockerfile, target
# prebuilt). Once all pass, publish makes one multi-architecture image and
# pins it by name and digest in deploy/kustomization.yaml for Argo CD. Tags
# carry the run id, so a rerun never retags (and orphans) a pinned digest.
name: Worker image
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - cli/**
      - rocky-prism/**
      - rocky-prism-ffi/**
      - uniffi-bindgen/**
      - worker/**
      - .config/nextest.toml
      - .dockerignore
      - .github/workflows/worker.yaml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  # main's runs queue one after another; a branch's runs never displace them.
  group: prism-worker-image${{ github.ref != 'refs/heads/main' && format('-{0}', github.ref) || '' }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/bierdav/prism-worker
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in the tests' build: smaller and faster to cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  LIBSQLITE3_SYS_USE_PKG_CONFIG: 0
jobs:
  # The tests are CPU-bound (each sync test runs several replicas), and the
  # x64 runners' 4 vCPUs are 2 cores: three shards there, two on arm64.
  test:
    name: test (${{ matrix.arch }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, shard: 1, shards: 3 }
          - { arch: amd64, runner: ubuntu-24.04, shard: 2, shards: 3 }
          - { arch: amd64, runner: ubuntu-24.04, shard: 3, shards: 3 }
          - { arch: arm64, runner: ubuntu-24.04-arm, shard: 1, shards: 2 }
          - { arch: arm64, runner: ubuntu-24.04-arm, shard: 2, shards: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      # Rocky's bundled SQLite generates its bindings with bindgen.
      - name: libclang
        run: |
          if ! ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libclang-dev
          fi
      # The dependencies' build output, keyed by the lockfile and toolchain;
      # a change to the workspace's code compiles only the workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs the tests side by side, this shard's slice of them; its
      # ci profile (.config/nextest.toml) gives a failed test up to two more
      # attempts, for the timing-sensitive sync tests.
      - name: Test
        run: |
          cargo nextest run --locked --workspace --profile ci \
            --partition "slice:${{ matrix.shard }}/${{ matrix.shards }}"
      - name: Doc tests
        if: matrix.shard == 1
        run: cargo test --locked --workspace --doc
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: libclang
        run: |
          if ! ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libclang-dev
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: |
          cargo build --locked --release -p prism-worker -p prism-cli
          install -D -t dist target/release/prism-worker target/release/prism
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The binaries link glibc dynamically: the runner's (Ubuntu 24.04)
      # must be no newer than distroless's (Debian 13), which the smoke test
      # checks by running both binaries in the image.
      - name: Image
        run: |
          set -eu
          docker buildx build --platform "linux/${{ matrix.arch }}" --provenance=false --sbom=false \
            -f worker/Dockerfile --target prebuilt --load -t "$IMAGE:$ARCH_TAG" dist
          docker run --rm "$IMAGE:$ARCH_TAG" --help
          docker run --rm --entrypoint /prism "$IMAGE:$ARCH_TAG" --help
          config="$(docker image inspect --format '{{.Config.User}} {{json .Config.Entrypoint}} {{.Architecture}}' "$IMAGE:$ARCH_TAG")"
          echo "$config"
          [ "$config" = '65532 ["/prism-worker"] ${{ matrix.arch }}' ]
          docker push "$IMAGE:$ARCH_TAG"
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge both architectures
        id: merge
        env:
          TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -eu
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$TAG" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          case "$digest" in sha256:*) ;; *) echo "No manifest digest for $IMAGE:$TAG"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Pin the image for Argo CD
        if: github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.sha }}-${{ github.run_id }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -eu
          pin() {
            python3 - <<'PY'
          import os, re
          path = 'deploy/kustomization.yaml'
          text = open(path).read()
          block = re.compile(r'(?ms)^  - name: prism-worker\n.*?(?=^  - |\Z)')
          entry = ('  - name: prism-worker\n'
                   f"    newName: {os.environ['IMAGE']}\n"
                   f"    newTag: {os.environ['TAG']}\n"
                   f"    digest: {os.environ['DIGEST']}\n")
          text = block.sub(entry, text) if block.search(text) else text.rstrip('\n') + '\n' + entry
          open(path, 'w').write(text)
          PY
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only a newer commit that builds a worker image owns the pin.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if [ -n "$(git log --format=%H "${SHA}..origin/main" -- Cargo.toml Cargo.lock cli rocky-prism rocky-prism-ffi uniffi-bindgen worker .config/nextest.toml .dockerignore .github/workflows/worker.yaml)" ]; then
              echo "a newer worker build on main owns the pin"
              exit 0
            fi
            git reset --hard origin/main
            pin
            git add deploy/kustomization.yaml
            if git diff --cached --quiet; then exit 0; fi
            # Pushes with GITHUB_TOKEN start no workflow; the marker is for
            # readers (and fleet-prism skips deploy/-only commits).
            git commit -m "Pin prism-worker image ${SHA} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed (attempt $attempt); retrying in 5 seconds."
            sleep 5
          done
          exit 1
