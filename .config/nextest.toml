# cargo-nextest's settings. CI (.github/workflows/worker.yaml) runs the
# workspace's tests with the ci profile, split across runners.

[profile.ci]
fail-fast = false
# The coordinated sealing test (rocky-prism/tests/coordinated.rs) hangs now
# and then on the shared amd64 runners: one replica's seal status stops
# answering after a compaction, so its own deadline never fires. It passes
# locally (about 6 minutes); run it there with
# `cargo test -p rocky-prism --features coordinator --test coordinated` until
# the hang is understood.
default-filter = "not binary_id(rocky-prism::coordinated)"
# Some sync tests are timing-sensitive on the shared runners: a failed test
# gets up to two more attempts (and is reported as flaky if one passes).
retries = 2
slow-timeout = { period = "60s", terminate-after = 5 }

# The sync tests that start several replicas run for 20 to 80 seconds: start
# them first, so they don't all end up last, side by side.
[[profile.ci.overrides]]
filter = "binary_id(rocky-prism-ffi::api) | binary_id(rocky-prism::enroll) | binary_id(rocky-prism::dial_only) | binary_id(rocky-prism-ffi::provisioned) | binary_id(rocky-prism-ffi::direct) | binary_id(rocky-prism::placement)"
priority = 50

# The coordinated sealing test (rocky-prism/tests/coordinated.rs) runs three
# voters and three replicas through several seals: about six minutes in a
# debug build here, up to about 15 on the shared runners, not seconds. A
# retry would double that, so it gets none, and 30 minutes before it's killed.
[[profile.ci.overrides]]
filter = "binary_id(rocky-prism::coordinated)"
priority = 60
retries = 0
slow-timeout = { period = "60s", terminate-after = 30 }
