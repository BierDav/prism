[package]
name = "prism-uniffi-bindgen"
description = "gobley's UniFFI bindgen for Kotlin Multiplatform, run on librocky_prism_ffi (shared/default.nix)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
camino = "1"
gobley-uniffi-bindgen = "=0.3.7"
toml = "0.5"
uniffi_bindgen = "=0.29.4"
