[workspace]
resolver = "3"
members = ["cli", "rocky-prism", "rocky-prism-ffi", "uniffi-bindgen", "worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/BierDav/prism"

[workspace.dependencies]
rocky-sdk = { git = "https://github.com/BierDav/rocky", rev = "85559db8f449d32d6402b4b6a10fd29bdcc7696d" }
rocky-tcp = { git = "https://github.com/BierDav/rocky", rev = "85559db8f449d32d6402b4b6a10fd29bdcc7696d", features = ["websocket"] }
# Seal coordination (rocky-prism's `coordinator` feature): the client of the
# public voters at rocky.quickme.at, reached over iroh through their relay.
rocky-coordinator = { git = "https://github.com/BierDav/rocky", rev = "85559db8f449d32d6402b4b6a10fd29bdcc7696d" }
rocky-iroh = { git = "https://github.com/BierDav/rocky", rev = "85559db8f449d32d6402b4b6a10fd29bdcc7696d" }
rocky-voter = { git = "https://github.com/BierDav/rocky", rev = "85559db8f449d32d6402b4b6a10fd29bdcc7696d" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
