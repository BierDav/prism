[workspace]
resolver = "3"
members = ["cli", "rocky-prism", "rocky-prism-ffi", "uniffi-bindgen", "worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/BierDav/prism"

[workspace.dependencies]
rocky-sdk = { git = "https://github.com/BierDav/rocky", rev = "69a15cb624ac4291e2848baaf2f8f08413128414" }
rocky-tcp = { git = "https://github.com/BierDav/rocky", rev = "69a15cb624ac4291e2848baaf2f8f08413128414", features = ["websocket"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
